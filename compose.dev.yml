# Postgres for local development only. Run the app itself with `bun dev`.
# Its own project name and an unusual port, so neither a `down -v` nor the default
# DATABASE_URL in src/env.js can reach another Postgres on this machine.
name: stash-dev

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_DB: stash
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - stash-dev-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stash"]
      interval: 1s
      timeout: 3s
      retries: 30

volumes:
  stash-dev-db:
